            .grid {
                --sz: 4;
                background: #000;
                width: 100vh;
                height: 85vh;
                display: grid;
                grid-template-columns: repeat(var(--sz), 1fr);
                grid-template-rows: repeat(var(--sz), 1fr);
                gap: 3px;
                padding: 3px;
            }
            .cell {
                background: #393939;
                border-radius: 2px;
            }
